<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibliotheca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="shelfTopbar">
      <div class="brand" aria-label="Bibliotheca">
        <span class="brand-mark">❦</span>
        <h1>Bibliotheca</h1>
      </div>
      <div class="topbar-actions">
        <input id="searchInput" class="search" type="search" placeholder="Buscar por título, autor ou tag" aria-label="Buscar livros" />
        <select id="statusFilter" class="select" aria-label="Filtrar por status">
          <option value="">Todos</option>
          <option value="READING">Lendo</option>
          <option value="FINISHED">Lido</option>
          <option value="NOT_STARTED">Não lido</option>
        </select>
        <select id="sizeSelect" class="select" aria-label="Tamanho dos livros">
          <option value="sm">Pequenos</option>
          <option value="md" selected>Médios</option>
          <option value="lg">Grandes</option>
        </select>
        <button id="themeToggle" class="btn icon" title="Alternar tema" aria-label="Alternar tema">◐</button>
        <button id="addBookBtn" class="btn primary">Adicionar Livro</button>
      </div>
    </header>

    <main id="shelfView" class="shelf-view" aria-live="polite">
      <div id="shelfContainer" class="shelf-container"></div>
      <div id="emptyState" class="empty-state hidden">
        <svg viewBox="0 0 240 160" class="empty-ill" aria-hidden="true">
          <defs><linearGradient id="wood" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7a4b28"/><stop offset="1" stop-color="#4a2b16"/></linearGradient></defs>
          <rect x="20" y="20" width="200" height="120" rx="6" fill="url(#wood)" opacity="0.25"/>
          <rect x="30" y="70" width="180" height="10" rx="2" fill="#6b4423"/>
          <rect x="30" y="120" width="180" height="10" rx="2" fill="#6b4423"/>
          <rect x="55" y="40" width="18" height="30" rx="2" fill="#c9a227" opacity="0.6"/>
          <rect x="78" y="35" width="16" height="35" rx="2" fill="#1e3a5f" opacity="0.5"/>
          <rect x="98" y="42" width="20" height="28" rx="2" fill="#6b4423" opacity="0.5"/>
        </svg>
        <h2>Sua estante está vazia</h2>
        <p>Adicione seu primeiro livro em PDF, EPUB, TXT e outros formatos.</p>
        <button class="btn primary" id="emptyAddBtn">Adicionar Livro</button>
      </div>
      <div id="shelfLoading" class="skeleton-shelf">
        <div class="sk-row"></div><div class="sk-row"></div>
      </div>
    </main>

    <section id="readerView" class="reader-view hidden" aria-label="Leitor">
      <div class="reader-top" id="readerTop">
        <button id="backToShelf" class="btn icon" title="Voltar à estante" aria-label="Voltar">←</button>
        <div class="reader-meta">
          <div id="readerTitle" class="reader-title"></div>
          <div id="readerAuthor" class="reader-author"></div>
        </div>
        <div class="reader-meta-right"><span id="timeLeft"></span></div>
      </div>
      <div class="reader-body">
        <aside id="tocPanel" class="side-panel hidden" aria-label="Sumário">
          <div class="panel-header"><h3>Sumário</h3><button class="btn icon" data-close="tocPanel">✕</button></div>
          <div id="tocContent" class="panel-content"></div>
        </aside>
        <aside id="searchPanel" class="side-panel hidden" aria-label="Busca">
          <div class="panel-header"><h3>Busca</h3><button class="btn icon" data-close="searchPanel">✕</button></div>
          <div class="panel-content">
            <div class="search-row"><input id="readerSearchInput" placeholder="Buscar no livro"/><button id="readerSearchBtn" class="btn">Ir</button></div>
            <div id="searchResults"></div>
          </div>
        </aside>
        <div class="reader-stage-wrap" id="readerStageWrap">
          <div class="reader-stage theme-paper" id="readerStage">
            <div class="flip-book" id="flipBook">
              <div class="page-sheet current" id="pageCurrent"></div>
              <div class="page-sheet next" id="pageNext"></div>
            </div>
            <div id="epubContainer" class="epub-container hidden"></div>
            <div id="textContainer" class="text-container hidden"></div>
          </div>
          <div class="tap-zone left" id="tapPrev" aria-label="Página anterior"></div>
          <div class="tap-zone right" id="tapNext" aria-label="Próxima página"></div>
        </div>
      </div>
      <div class="reader-bottom" id="readerBottom">
        <div class="controls-row">
          <button class="btn icon" id="prevPage" title="Anterior">‹</button>
          <input type="range" id="progressSlider" min="1" max="1" value="1" aria-label="Progresso" />
          <button class="btn icon" id="nextPage" title="Próxima">›</button>
          <span id="pageInfo" class="page-info">1 / 1</span>
          <span id="percentInfo" class="page-info">0%</span>
        </div>
        <div class="controls-row secondary">
          <button class="btn sm" id="zoomOut">A-</button>
          <button class="btn sm" id="zoomIn">A+</button>
          <select id="themeSelect" class="select sm" title="Tema">
            <option value="paper">Claro</option><option value="sepia">Sépia</option><option value="dark">Escuro</option><option value="oled">Preto</option>
          </select>
          <select id="animSelect" class="select sm" title="Animação">
            <option value="flip">Page Flip</option><option value="slide">Slide</option><option value="fade">Fade</option>
          </select>
          <button class="btn sm" id="spreadToggle" title="Duas páginas">Spread</button>
          <button class="btn sm" id="tocBtn">Sumário</button>
          <button class="btn sm" id="searchBtn">Busca</button>
          <button class="btn sm" id="bookmarkBtn">Marcador</button>
          <button class="btn sm" id="noteBtn">Nota</button>
          <button class="btn sm" id="ttsBtn">TTS</button>
          <button class="btn sm" id="fsBtn">Tela cheia</button>
        </div>
      </div>
    </section>
  </div>

  <div id="uploadModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Adicionar livro">
    <div class="modal-card">
      <div class="modal-header"><h3>Adicionar Livro</h3><button class="btn icon" id="closeUpload">✕</button></div>
      <div id="dropZone" class="drop-zone" tabindex="0">
        <p>Arraste e solte arquivos aqui ou clique para selecionar</p>
        <small>PDF, EPUB, MOBI, CBZ, TXT, FB2, AZW3</small>
        <input type="file" id="fileInput" multiple accept=".pdf,.epub,.mobi,.cbz,.txt,.fb2,.azw3" hidden />
      </div>
      <div id="uploadProgress" class="upload-progress"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
