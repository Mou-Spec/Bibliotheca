spring.application.name=Bibliotheca
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/bibliotheca-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

bibliotheca.storage.path=./data/books
bibliotheca.upload.max-size-bytes=209715200
bibliotheca.upload.allowed-ext=pdf,epub,mobi,cbz,txt,fb2,azw3

spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
logging.level.com.bibliotheca=INFO
